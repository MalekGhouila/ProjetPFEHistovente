<div class="dashboard">

  <div class="dashboard-header">
    <h1>Stores Management</h1>
    <p>Overview of all NAF NAF stores</p>
  </div>

  <div class="stores-card">

    <!-- Search outside table -->
    <div class="table-toolbar">
      <input
        pInputText
        type="text"
        placeholder="Search stores..."
        (input)="dt.filterGlobal($any($event.target).value, 'contains')"
        class="search-input"/>
    </div>

    <p-table
      #dt
      [value]="stores"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [globalFilterFields]="['magasin', 'code']">

      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Store Name</th>
          <th>Code</th>
          <th>Category</th>
          <th>Status</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-store>
        <tr>
          <td>{{ store.idMagasin }}</td>
          <td>
            <i class="pi pi-building"></i>
            {{ store.magasin }}
          </td>
          <td>{{ store.code }}</td>
          <td>{{ store.idCategorie || 'N/A' }}</td>
          <td>
            <p-tag
              [value]="getStatusLabel(store.etat)"
              [severity]="getStatusSeverity(store.etat)"/>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" style="text-align: center">No stores found</td>
        </tr>
      </ng-template>

    </p-table>
  </div>
</div>
