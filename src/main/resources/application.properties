spring.application.name=ProjetPFEHistoVente

# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/erp_sales?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Configuration
jwt.secret=nafnaf_sales_intelligence_platform_secret_key_2026_very_long_and_secure
jwt.expiration=86400000

# Connection timeout (600 seconds = 10 minutes)
spring.datasource.hikari.connection-timeout=600000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000

# Transaction timeout (600 seconds = 10 minutes)
spring.transaction.default-timeout=600
spring.mvc.async.request-timeout=600000

# ML API
ml.api.url=http://localhost:8000